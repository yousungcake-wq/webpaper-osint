name: site (GitHub Pages)

# 사이트는 정적 파일 3개(index.html + 그 안의 인라인 CSS/JS)뿐이다.
# 데이터(feed.json)는 여기서 배포하지 않는다 — 5분마다 배포하면 Pages 빌드 한도
# (시간당 10회)에 걸린다. 데이터는 data/feed.json 으로 커밋되고 사이트가 raw 에서 읽는다.
# 그래서 이 워크플로는 site/ 가 바뀔 때만 돈다.

on:
  push:
    branches: [main]
    paths:
      - "site/**"
      - ".github/workflows/site.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: 사이트 데이터 생성 (state → site/feed*.json)
        run: python3 feedgen.py

      - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5
      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
