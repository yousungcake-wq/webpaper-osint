name: OSINT Telegram bot

# 한 번 뜨면 회차 1개. 트리거는 외부 크론(cron-job.org, 5분)이 주고,
# GitHub 자체 예약은 이 계정에서 스로틀되어 보조로만 둔다.
# 예약이 며칠 죽었을 때는 osint-block.yml(수동, 5시간 30분)을 쓴다.
on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "게시하지 않고 본문 미리보기만"
        type: boolean
        default: false

concurrency:
  group: osint-cycle
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  cycle:
    runs-on: ubuntu-latest
    # 회차는 20~50초. 길어져도 다음 트리거가 취소하므로 짧게 잡아 이상 동작을 빨리 드러낸다.
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - name: Run one cycle
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          CEREBRAS_API_KEY: ${{ secrets.CEREBRAS_API_KEY }}
          MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          LOOP_MINUTES: "0"          # 1회차
          COMMIT_STATE: "1"
          DRY_RUN: ${{ inputs.dry_run && '1' || '' }}
        run: |
          git config user.name  "osint-bot"
          git config user.email "osint-bot@users.noreply.github.com"
          python run_once.py
