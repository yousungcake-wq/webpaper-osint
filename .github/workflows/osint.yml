name: OSINT Telegram bot

# 정각(0,5,10...)은 GitHub 러너가 몰려 지연·드롭되기 쉬워 2분씩 밀었다.
# 범위+스텝(1-56/5) 표기는 등록이 안 되는 사례가 있어 명시적 목록으로 쓴다.
on:
  schedule:
    - cron: "2,7,12,17,22,27,32,37,42,47,52,57 * * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "게시하지 않고 본문 미리보기만"
        type: boolean
        default: false

# 한 번에 한 회차만. 상태 파일 커밋이 겹치지 않게 한다.
concurrency:
  group: osint-cycle
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  cycle:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run one cycle
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          CEREBRAS_API_KEY: ${{ secrets.CEREBRAS_API_KEY }}
          MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          DRY_RUN: ${{ inputs.dry_run && '1' || '' }}
        run: python run_once.py

      - name: Commit state
        run: |
          set -e
          if [ -z "$(git status --porcelain state/)" ]; then
            echo "상태 변경 없음 — 커밋 생략"
            exit 0
          fi
          git config user.name  "osint-bot"
          git config user.email "osint-bot@users.noreply.github.com"
          git add state/posted.jsonl
          git commit -m "state: $(date -u '+%Y-%m-%d %H:%M') UTC"
          git pull --rebase --autostash origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"
