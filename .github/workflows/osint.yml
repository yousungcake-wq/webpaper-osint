name: OSINT Telegram bot

# 이 계정에서는 GitHub 예약(cron)이 실제로 발화하지 않는다(2026-11-08 검증:
# 같은 설정의 새 저장소도 16분간 0회). 그래서 워크플로는 "트리거 1회 = 4시간 자율 실행"
# 구조로 만들었고, 트리거는 폰 스케줄 태스크가 몇 시간에 한 번 보낸다.
# cron 은 계정 워밍업 후 살아날 수 있으니 남겨둔다(발화하면 그냥 한 블록 더 돈다).
on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "게시하지 않고 본문 미리보기만"
        type: boolean
        default: false
      minutes:
        description: "이번 실행에서 계속 돌 시간(분)"
        type: string
        default: "330"

# 회차가 20초 안에 끝나므로 겹치지 않는다. 혹시 겹치면 순서대로 실행한다.
concurrency:
  group: osint-cycle
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  cycle:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run cycles
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          CEREBRAS_API_KEY: ${{ secrets.CEREBRAS_API_KEY }}
          MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          # 기본은 회차 1개 — 외부 크론(cron-job.org)이 5분마다 정확히 밀어준다.
          # 비상시에만 `-f minutes=330` 으로 5시간 30분 자율 블록을 띄운다.
          LOOP_MINUTES: ${{ inputs.minutes || '0' }}
          COMMIT_STATE: "1"
          DRY_RUN: ${{ inputs.dry_run && '1' || '' }}
        run: |
          git config user.name  "osint-bot"
          git config user.email "osint-bot@users.noreply.github.com"
          python run_once.py
