name: OSINT Telegram bot

# 한 번 뜨면 회차 1개. 트리거는 외부 크론(cron-job.org, 5분)이 주고,
# GitHub 자체 예약은 이 계정에서 스로틀되어 보조로만 둔다.
# 예약이 며칠 죽었을 때는 osint-block.yml(수동, 5시간 30분)을 쓴다.
#
# 배포는 이 워크플로가 직접 한다(2026-11-10).
#   봇이 GITHUB_TOKEN 으로 푸시한 커밋은 **다른 워크플로를 트리거하지 않는다**(재귀 방지).
#   그래서 site.yml 의 paths 필터로는 배포가 안 붙는다 → 같은 워크플로 안에서 배포한다.
on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "게시하지 않고 본문 미리보기만"
        type: boolean
        default: false

concurrency:
  group: osint-cycle
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  cycle:
    runs-on: ubuntu-latest
    # 회차는 20~50초. 길어져도 다음 트리거가 취소하므로 짧게 잡아 이상 동작을 빨리 드러낸다.
    timeout-minutes: 10
    outputs:
      changed: ${{ steps.head.outputs.changed }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - name: Remember HEAD
        id: before
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Run one cycle
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TG_OWNER_CHAT: ${{ secrets.TG_OWNER_CHAT }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          CEREBRAS_API_KEY: ${{ secrets.CEREBRAS_API_KEY }}
          MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          LOOP_MINUTES: "0"          # 1회차
          COMMIT_STATE: "1"
          DRY_RUN: ${{ inputs.dry_run && '1' || '' }}
        run: |
          git config user.name  "osint-bot"
          git config user.email "osint-bot@users.noreply.github.com"
          python run_once.py

      - name: Did the cycle commit anything?
        id: head
        env:
          BEFORE: ${{ steps.before.outputs.sha }}
        run: |
          AFTER=$(git rev-parse HEAD)
          echo "before=$BEFORE after=$AFTER"
          if [ "$AFTER" != "$BEFORE" ]; then echo "changed=true" >> "$GITHUB_OUTPUT";
          else echo "changed=false" >> "$GITHUB_OUTPUT"; fi

  # 게시가 있었던 회차만 사이트를 다시 배포한다(사이트는 ./feed.json 을 읽는다).
  deploy:
    needs: cycle
    if: needs.cycle.outputs.changed == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    concurrency:
      group: pages
      cancel-in-progress: false
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      # ref: main 필수 — 기본값은 이벤트 시점의 SHA 라서 방금 커밋된 피드를 놓친다(실측 11:00).
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
      - name: 사이트 데이터 생성 (state → site/feed*.json)
        run: python3 feedgen.py

      - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5
      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
