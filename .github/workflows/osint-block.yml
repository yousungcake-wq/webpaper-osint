name: OSINT block (emergency)

# 비상용. 외부 크론이 며칠 죽었을 때 손으로 한 번 눌러 5시간 30분을 채운다.
#   gh workflow run osint-block.yml
#   gh workflow run osint-block.yml -f minutes=30 -f dry_run=true   # 시험
#
# 동시성 실측(2026-11-10):
#   같은 그룹의 **대기 중인** 회차끼리는 서로 취소되지만, **이미 실행 중인 잡은 선점되지 않는다.**
#   블록이 도는 동안 크론 회차는 pending 으로 쌓였다가 5분마다 서로 취소되고, 블록이 끝나야 시작한다.
#   → 블록은 중간에 죽지 않는다. 대신 도는 동안 일반 회차는 멈춘다(블록이 같은 주기로 게시하므로 결과는 동일).
#   과거 주석의 "5분 뒤 다음 회차가 이 블록을 취소한다"는 **틀렸다**.
on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "게시하지 않고 본문 미리보기만"
        type: boolean
        default: false
      minutes:
        description: "블록 길이(분). 기본 330. 시험할 땐 30 정도로"
        default: "330"

concurrency:
  group: osint-cycle
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  block:
    runs-on: ubuntu-latest
    # 330분 블록 + 여유. GitHub 잡 상한은 6시간(360분)이다.
    timeout-minutes: 355
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - name: Run block
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TG_OWNER_CHAT: ${{ secrets.TG_OWNER_CHAT }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          CEREBRAS_API_KEY: ${{ secrets.CEREBRAS_API_KEY }}
          MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          # 입력을 그대로 넘긴다. run_once.py 가 숫자 아닌 값은 0으로, 상한은 340으로 클램프한다
          # (여기서 fromJSON 으로 검증하면 잘못된 입력이 워크플로 자체를 죽여 비상구가 사라진다).
          LOOP_MINUTES: ${{ inputs.minutes }}
          COMMIT_STATE: "1"
          DRY_RUN: ${{ inputs.dry_run && '1' || '' }}
        run: |
          git config user.name  "osint-bot"
          git config user.email "osint-bot@users.noreply.github.com"
          python run_once.py

  # 블록이 끝나면 한 번 배포한다(블록 도중에는 배포하지 않는다 — 몇 시간짜리 잡 안에서
  # 배포를 반복하면 Pages 배포 큐만 쌓인다). 실패로 끝나도 커밋된 상태는 배포한다.
  deploy:
    needs: block
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 8
    concurrency:
      group: pages
      cancel-in-progress: false
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: main
      - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5
      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
