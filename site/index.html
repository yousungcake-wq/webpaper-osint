<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>WebPaper</title>
<meta name="description" content="세계 주요 매체의 국제 뉴스를 한국어로 요약한 브리핑.">
<meta name="theme-color" content="#ffffff" media="(prefers-color-scheme:light)">
<meta name="theme-color" content="#101114" media="(prefers-color-scheme:dark)">
<meta property="og:title" content="WebPaper">
<meta property="og:description" content="5분마다 갱신되는 국제 뉴스 브리핑">
<meta property="og:type" content="website">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='7' fill='%23191a1c'/><rect x='7' y='9' width='18' height='3' rx='1.5' fill='%23fff'/><rect x='7' y='15' width='18' height='2.4' rx='1.2' fill='%23ffffffaa'/><rect x='7' y='20' width='11' height='2.4' rx='1.2' fill='%23ffffffaa'/></svg>">
<script>/* 테마는 그리기 전에 정한다(깜빡임 방지) */
(function(){try{var t=localStorage.getItem('wp-theme');if(t==='dark'||t==='light')document.documentElement.dataset.theme=t;}catch(e){}})();
</script>
<style>
:root{
  --bg:#fff; --fg:#191919; --muted:#6b6b6b; --line:#ececec; --chip:#f2f4f6;
  --accent:#3182f6; --beatsel:#191919; --beatsel-fg:#fff;
  --t-tech:#3182f6; --t-economy:#0e9f6e; --t-conflict:#e02424; --t-politics:#4b5563; --t-other:#8b95a1;
  --font-base:16px; --font-summary:15px; --font-caption:13px;
  --lh:1.6; --tap:44px; --gap:14px; --radius:16px; --maxw:640px;
}
:root[data-theme="dark"]{
  --bg:#101114; --fg:#f0f1f3; --muted:#9aa0a6; --line:#26282d; --chip:#1c1e23;
  --accent:#4f9bff; --beatsel:#f0f1f3; --beatsel-fg:#101114;
  --t-tech:#6aa9ff; --t-economy:#34d399; --t-conflict:#f87171; --t-politics:#9aa5b4; --t-other:#7d8794;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#101114; --fg:#f0f1f3; --muted:#9aa0a6; --line:#26282d; --chip:#1c1e23;
    --accent:#4f9bff; --beatsel:#f0f1f3; --beatsel-fg:#101114;
    --t-tech:#6aa9ff; --t-economy:#34d399; --t-conflict:#f87171; --t-politics:#9aa5b4; --t-other:#7d8794;
  }
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--fg);font-size:var(--font-base);line-height:var(--lh);
  -webkit-text-size-adjust:100%;word-break:keep-all;
  font-family:system-ui,-apple-system,"Apple SD Gothic Neo","Malgun Gothic",sans-serif}
body{padding-bottom:96px}
h1,h2,p,ul{margin:0}
ul{padding:0;list-style:none}

/* ── 상단 패널: 로고 · 테마 · 검색 ───────────────────── */
.topbar{position:sticky;top:0;z-index:20;background:var(--bg);border-bottom:1px solid var(--line)}
/* 고정 시: 티커가 맨 위에 붙고 헤더는 그 아래(42px)에 붙는다.
   티커는 두 상태 모두 문서 흐름 안에 있으므로 카드는 절대 움직이지 않는다. */
body.is-pinned .topbar{top:42px}

/* ── 속보 티커 ─────────────────────────────────────── */
.ticker{position:relative;z-index:24;background:var(--bg);border-bottom:1px solid var(--line)}
.ticker[hidden]{display:none}
.ticker.is-pinned{position:sticky;top:0;z-index:26}
.ticker__bar{display:flex;align-items:center;gap:4px;max-width:var(--maxw);margin:0 auto;height:42px;
  padding:0 8px 0 10px}
.ticker__label{display:inline-flex;align-items:center;gap:5px;flex:0 0 auto;padding-right:4px;
  font-size:11.5px;font-weight:800;color:var(--t-conflict);letter-spacing:.02em}
.ticker__label::before{content:"";width:6px;height:6px;border-radius:50%;background:var(--t-conflict);
  animation:blink 1.8s ease-in-out infinite}
@keyframes blink{0%,100%{opacity:1}50%{opacity:.25}}
.ticker__viewport{flex:1 1 auto;min-width:0;overflow:hidden;
  -webkit-mask-image:linear-gradient(90deg,transparent,#000 10px,#000 calc(100% - 18px),transparent);
  mask-image:linear-gradient(90deg,transparent,#000 10px,#000 calc(100% - 18px),transparent)}
.ticker__track{display:inline-flex;white-space:nowrap;
  animation:marquee var(--dur,40s) linear infinite;will-change:transform}
.ticker__viewport:hover .ticker__track,
.ticker__viewport:active .ticker__track{animation-play-state:paused}
.ticker__item{border:0;background:none;padding:0;margin-right:26px;font:inherit;font-size:13px;
  color:var(--fg);cursor:pointer;white-space:nowrap;text-align:left}
.ticker__item:hover{color:var(--accent)}
.ticker__item b{margin-right:6px;color:var(--muted);font-weight:600;font-variant-numeric:tabular-nums}
@keyframes marquee{from{transform:translateX(0)}to{transform:translateX(-50%)}}
.ticker__btn{width:32px;height:32px;display:grid;place-items:center;border:0;border-radius:10px;
  background:transparent;color:var(--muted);cursor:pointer;flex:0 0 auto;transition:background .12s,color .12s}
.ticker__btn[hidden]{display:none}
.ticker__btn:hover{background:var(--chip);color:var(--fg)}
.ticker__btn[aria-pressed="true"]{color:var(--accent)}
.hd{display:flex;align-items:center;justify-content:space-between;gap:12px;
  max-width:var(--maxw);margin:0 auto;padding:10px 20px;min-height:56px}
.logo{font-size:20px;font-weight:750;letter-spacing:-.02em;color:var(--fg);text-decoration:none}
.hd__actions{display:flex;align-items:center;gap:6px}
.iconbtn{width:40px;height:40px;display:grid;place-items:center;border:0;border-radius:12px;
  background:transparent;color:var(--muted);cursor:pointer;text-decoration:none;
  -webkit-tap-highlight-color:transparent;transition:background .12s,color .12s}
.iconbtn:hover{background:var(--chip);color:var(--fg)}
.iconbtn:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

/* ── 분야 칩 (스크롤과 함께 사라진다) ─────────────────── */
.filters{display:flex;gap:8px;overflow-x:auto;padding:6px 20px 10px;scrollbar-width:none;
  max-width:var(--maxw);margin:0 auto}
.filters::-webkit-scrollbar{display:none}
.chip{flex:0 0 auto;min-height:34px;padding:0 14px;border:0;border-radius:17px;background:var(--chip);
  color:var(--muted);font:inherit;font-size:13px;font-weight:600;cursor:pointer;
  transition:background .12s,color .12s;-webkit-tap-highlight-color:transparent}
.chip[aria-pressed="true"]{background:var(--beatsel);color:var(--beatsel-fg)}
.chip:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

#feed{max-width:var(--maxw);margin:0 auto;padding:8px 20px 0;display:grid;gap:var(--gap)}
@media (min-width:900px){
  :root{--maxw:940px}
  #feed{grid-template-columns:1fr 1fr;align-items:start}
  #feed .more,#feed .empty{grid-column:1 / -1}
}

.card{display:block;padding:16px;border:1px solid var(--line);border-radius:var(--radius);background:var(--bg);
  cursor:pointer;transition:background .12s,border-color .12s;-webkit-tap-highlight-color:transparent;
  content-visibility:auto;contain-intrinsic-size:auto 132px}
.card:hover{border-color:color-mix(in srgb,var(--fg) 16%,var(--line))}
.card:active{background:var(--chip)}
.card:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

.card__meta{display:flex;align-items:center;gap:7px;margin-bottom:8px;min-width:0}
.beat{font-size:11px;font-weight:700;letter-spacing:.02em;padding:2px 8px;border-radius:6px;
  color:var(--c,var(--muted));background:color-mix(in srgb,var(--c,var(--muted)) 12%,transparent);flex:0 0 auto}
.beat[data-beat="TECH"]{--c:var(--t-tech)}
.beat[data-beat="ECONOMY"]{--c:var(--t-economy)}
.beat[data-beat="CONFLICT"]{--c:var(--t-conflict)}
.beat[data-beat="POLITICS"]{--c:var(--t-politics)}
.beat[data-beat="OTHER"]{--c:var(--t-other)}
.card__where{font-size:var(--font-caption);color:var(--muted);overflow:hidden;text-overflow:ellipsis;
  white-space:nowrap;flex:1 1 auto;min-width:0}
.card__time{font-size:var(--font-caption);color:var(--muted);white-space:nowrap;flex:0 0 auto;
  font-variant-numeric:tabular-nums}
.card__title{font-size:var(--font-base);font-weight:700;line-height:1.45;margin-bottom:6px;letter-spacing:-.01em;
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.card__title[lang="en"]{font-size:15px;font-weight:650}
.card__summary{font-size:var(--font-summary);color:var(--muted);line-height:1.55;
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.card__summary:empty{display:none}

.empty{padding:56px 0;text-align:center;color:var(--muted);font-size:var(--font-summary)}
.empty strong{display:block;color:var(--fg);font-size:var(--font-base);margin-bottom:6px}
.empty button{margin-top:14px;min-height:40px;padding:0 18px;border:1px solid var(--line);border-radius:20px;
  background:var(--chip);color:var(--fg);font:inherit;font-size:var(--font-caption);cursor:pointer}
.more{display:grid;place-items:center;padding:4px 0 18px}
.more button{min-height:44px;padding:0 22px;border:1px solid var(--line);border-radius:22px;background:var(--bg);
  color:var(--muted);font:inherit;font-size:var(--font-caption);cursor:pointer}

/* 새 기사 알림 — 하나만, 알림은 배지 하나 */
.badge{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);z-index:30;min-height:var(--tap);
  padding:0 20px;border:0;border-radius:22px;background:var(--beatsel);color:var(--beatsel-fg);
  font:inherit;font-size:var(--font-summary);font-weight:600;cursor:pointer;
  box-shadow:0 2px 10px rgba(0,0,0,.18)}
.badge[hidden]{display:none}

/* 스켈레톤 — 그라데이션 없이 투명도만 */
.card--sk{pointer-events:none;cursor:default;content-visibility:visible}
.sk{background:var(--chip);border-radius:6px;animation:fade 1.3s ease-in-out infinite}
.sk--meta{display:flex;gap:8px;margin-bottom:10px}
.sk--pill{width:52px;height:16px;border-radius:6px}
.sk--where{width:38%;height:14px}
.sk--time{width:44px;height:14px;margin-left:auto}
.sk--title{width:94%;height:17px;margin-bottom:7px}
.sk--title2{width:62%;height:17px;margin-bottom:10px}
.sk--line{width:100%;height:13px;margin-bottom:6px}
.sk--line2{width:80%;height:13px}
@keyframes fade{0%,100%{opacity:1}50%{opacity:.45}}

.sheet{position:fixed;inset:auto 0 0 0;margin:0 auto;width:100%;max-width:var(--maxw);border:0;padding:0;
  border-radius:20px 20px 0 0;background:var(--bg);color:var(--fg);max-height:86dvh;
  box-shadow:0 -6px 24px rgba(0,0,0,.16);transform:translateY(100%);
  transition:transform .26s cubic-bezier(.2,.8,.2,1)}
.sheet.is-open{transform:translateY(0)}
.sheet::backdrop{background:rgba(0,0,0,.4)}
.sheet__inner{padding:8px 20px calc(24px + env(safe-area-inset-bottom));max-height:86dvh;
  overflow-y:auto;overscroll-behavior:contain}
.sheet__grip{width:36px;height:4px;border-radius:2px;background:var(--line);margin:0 auto 14px}
.sheet__meta{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:10px}
.sheet__when{font-size:var(--font-caption);color:var(--muted)}
.sheet__title{font-size:20px;font-weight:750;line-height:1.4;margin-bottom:4px;letter-spacing:-.01em}
.sheet__orig{font-size:var(--font-caption);color:var(--muted);margin-bottom:14px;padding-bottom:14px;
  border-bottom:1px solid var(--line)}
.sheet__orig:empty{display:none}
.sheet__body{font-size:var(--font-summary);line-height:1.7;white-space:pre-wrap}
.sheet__body:empty{display:none}
.sheet__src{margin-top:16px;padding-top:14px;border-top:1px solid var(--line);display:grid;gap:4px}
.sheet__src:empty{display:none}
.sheet__src li{font-size:var(--font-caption);color:var(--muted)}
.sheet__src li::before{content:"· ";font-weight:700}
.sheet__cta{display:flex;align-items:center;justify-content:center;margin-top:18px;min-height:var(--tap);
  border-radius:12px;background:var(--accent);color:#fff;text-decoration:none;font-weight:700;
  font-size:var(--font-summary)}
.sheet__cta[hidden]{display:none}

@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div class="ticker" id="ticker" hidden>
  <div class="ticker__bar">
    <button class="ticker__btn" id="unpinBtn" type="button" hidden aria-label="속보 고정 해제" aria-pressed="true">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"
           stroke-linecap="round" aria-hidden="true"><path d="M15 6l-6 6 6 6"/></svg>
    </button>
    <span class="ticker__label">속보</span>
    <div class="ticker__viewport"><div class="ticker__track" id="tickerTrack"></div></div>
    <button class="ticker__btn" id="pinBtn" type="button" aria-label="속보 고정" aria-pressed="false">
      <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
           stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M9 4h6l-1 7 3 4H7l3-4z"/><path d="M12 15v6"/></svg>
    </button>
  </div>
</div>

<div class="topbar">
  <header class="hd">
    <a class="logo" href="./">WebPaper</a>
    <div class="hd__actions">
      <button id="theme" class="iconbtn" type="button" aria-label="테마 바꾸기"></button>
      <a class="iconbtn" href="./search.html" aria-label="검색">
        <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"
             stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
      </a>
    </div>
  </header>
  <nav class="filters" id="filters" aria-label="분야">
    <button class="chip" data-beat="ALL" aria-pressed="true">전체</button>
    <button class="chip" data-beat="TECH" aria-pressed="false">테크</button>
    <button class="chip" data-beat="ECONOMY" aria-pressed="false">경제</button>
    <button class="chip" data-beat="CONFLICT" aria-pressed="false">분쟁</button>
    <button class="chip" data-beat="POLITICS" aria-pressed="false">정치</button>
    <button class="chip" data-beat="OTHER" aria-pressed="false">기타</button>
  </nav>
</div>

<main id="feed" aria-live="polite" aria-busy="true"></main>

<button id="newBadge" class="badge" hidden>새 기사 <b id="badgeN">0</b>건</button>

<dialog id="sheet" class="sheet" aria-label="기사 자세히">
  <div class="sheet__inner">
    <div class="sheet__grip" aria-hidden="true"></div>
    <div class="sheet__meta">
      <span class="sheet__beat beat"></span>
      <span class="sheet__when"></span>
    </div>
    <h2 class="sheet__title"></h2>
    <p class="sheet__orig"></p>
    <p class="sheet__body"></p>
    <ul class="sheet__src"></ul>
    <a class="sheet__cta" target="_blank" rel="noopener noreferrer">기사 읽기 →</a>
  </div>
</dialog>

<script>
/* ── 데이터 ──────────────────────────────────────────────────────────
   feed.json 은 사이트와 함께 배포된다(같은 출처). 게시 → 커밋 → 같은 워크플로의
   deploy 잡이 Pages 로 배포하고(≈30초) Pages 는 배포 때 CDN 캐시를 비운다. */
const FEED_SOURCES = [
  './feed.json',
  'https://raw.githubusercontent.com/yousungcake-wq/webpaper-osint/main/site/feed.json'
];
const POLL_MS = 60_000;
const POLL_FAST_MS = 20_000;
const PAGE = 40;

const BEAT = { TECH:'테크', ECONOMY:'경제', CONFLICT:'분쟁', POLITICS:'정치', OTHER:'기타' };
const REGION = { US:'북미', LATAM:'중남미', EUROPE:'유럽', ASIA:'아시아', MIDDLE_EAST:'중동', AFRICA:'아프리카', GLOBAL:'국제' };
const $ = (s, r=document) => r.querySelector(s);

const feedEl = $('#feed'), badge = $('#newBadge'), badgeN = $('#badgeN'), sheet = $('#sheet');

const state = {
  items: [], beat: 'ALL', shown: 0, list: [],
  seen: new Set(), loading: true
};

const titleOf = it => it.h || it.t || '';
const keyOf = it => (it.ts || '') + '|' + titleOf(it);

/* ── 테마 ───────────────────────────────────────────────────────── */
const themeBtn = $('#theme');
const SUN = '<svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M2 12h2M20 12h2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M19.1 4.9l-1.4 1.4M6.3 17.7l-1.4 1.4"/></svg>';
const MOON = '<svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M21 12.8A8.5 8.5 0 1 1 11.2 3a6.6 6.6 0 0 0 9.8 9.8z"/></svg>';
const activeTheme = () => document.documentElement.dataset.theme
  || (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
function paintTheme(){
  const t = activeTheme();
  themeBtn.innerHTML = t === 'dark' ? SUN : MOON;
  themeBtn.title = t === 'dark' ? '밝은 화면으로' : '어두운 화면으로';
}
themeBtn.addEventListener('click', () => {
  const next = activeTheme() === 'dark' ? 'light' : 'dark';
  document.documentElement.dataset.theme = next;
  try { localStorage.setItem('wp-theme', next); } catch {}
  paintTheme();
});
matchMedia('(prefers-color-scheme: dark)').addEventListener?.('change', paintTheme);
paintTheme();

/* ── 시간 ───────────────────────────────────────────────────────── */
function kst(ts, withDate){
  if (!ts) return '';
  const d = new Date(ts);
  if (isNaN(d)) return '';
  const f = new Intl.DateTimeFormat('ko-KR', {
    timeZone:'Asia/Seoul', month:'numeric', day:'numeric',
    hour:'2-digit', minute:'2-digit', hour12:false
  }).formatToParts(d).reduce((o,p)=>(o[p.type]=p.value,o),{});
  const hm = f.hour + ':' + f.minute;
  return withDate ? `${f.month}월 ${f.day}일 ${hm}` : hm;
}
function relTime(ts){
  const d = new Date(ts);
  if (isNaN(d)) return '';
  const m = Math.floor((Date.now() - d.getTime()) / 60000);
  if (m < 1) return '방금';
  if (m < 60) return m + '분 전';
  if (m < 24*60) return Math.floor(m/60) + '시간 전';
  return kst(ts, true);
}
/*보고 있는 동안에도 "n분 전"이 흐른다 — DOM 은 그대로, 텍스트만 갱신 */
function tickTimes(){
  document.querySelectorAll('.card__time[data-ts]').forEach(el => {
    const v = relTime(el.dataset.ts);
    if (el.textContent !== v) el.textContent = v;
  });
  document.querySelector('.sheet.is-open .sheet__when')?.dispatchEvent(new Event('tick'));
}
setInterval(tickTimes, 30_000);
document.addEventListener('visibilitychange', () => { if (!document.hidden) tickTimes(); });

/* ── 카드 ───────────────────────────────────────────────────────── */
function setBeat(el, b){
  if (b && BEAT[b]) { el.textContent = BEAT[b]; el.dataset.beat = b; }
  else { el.textContent = ''; delete el.dataset.beat; }
}

function cardNode(it){
  const el = document.createElement('article');
  el.className = 'card';
  el.tabIndex = 0;
  el.setAttribute('role','button');
  el.setAttribute('aria-label', titleOf(it));

  const meta = document.createElement('div');
  meta.className = 'card__meta';

  const beatEl = document.createElement('span');
  beatEl.className = 'card__beat beat';
  setBeat(beatEl, it.b);

  const where = document.createElement('span');
  where.className = 'card__where';
  where.textContent = [REGION[it.r], (it.src && it.src[0]) || ''].filter(Boolean).join(' · ');

  const timeEl = document.createElement('time');
  timeEl.className = 'card__time';
  timeEl.dataset.ts = it.ts || '';
  timeEl.textContent = relTime(it.ts);
  timeEl.dateTime = it.ts || '';
  timeEl.title = kst(it.ts, true);

  meta.append(beatEl, where, timeEl);

  const titleEl = document.createElement('h2');
  titleEl.className = 'card__title';
  titleEl.textContent = titleOf(it);
  if (!it.h) titleEl.lang = 'en';

  const sumEl = document.createElement('p');
  sumEl.className = 'card__summary';
  sumEl.textContent = it.summary || '';

  el.append(meta, titleEl, sumEl);
  el.addEventListener('click', () => openSheet(it));
  el.addEventListener('keydown', e => { if (e.key==='Enter'||e.key===' '){ e.preventDefault(); openSheet(it); } });
  return el;
}

function skeletonNode(){
  const el = document.createElement('div');
  el.className = 'card card--sk';
  el.setAttribute('aria-hidden','true');
  el.innerHTML =
    '<div class="sk--meta"><span class="sk sk--pill"></span><span class="sk sk--where"></span><span class="sk sk--time"></span></div>' +
    '<div class="sk sk--title"></div><div class="sk sk--title2"></div>' +
    '<div class="sk sk--line"></div><div class="sk sk--line2"></div>';
  return el;
}
function skeletons(){
  const n = window.innerWidth >= 900 ? 6 : 3;
  feedEl.replaceChildren(...Array.from({length:n}, skeletonNode));
  feedEl.setAttribute('aria-busy','true');
}

function filtered(){
  return state.beat === 'ALL' ? state.items : state.items.filter(x => x.b === state.beat);
}

function render(reset){
  feedEl.setAttribute('aria-busy','false');
  if (state.loading) return;
  const list = filtered();
  state.list = list;

  if (!list.length){
    feedEl.innerHTML = state.items.length
      ? '<p class="empty"><strong>이 분야 기사가 아직 없어요</strong>다른 분야를 눌러 보세요.</p>'
      : '<p class="empty"><strong>아직 보도된 기사가 없어요</strong>5분마다 자동으로 확인해요.</p>';
    state.shown = 0;
    return;
  }

  if (reset) state.shown = 0;
  const from = reset ? 0 : state.shown;
  const next = Math.min(list.length, from + PAGE);
  const frag = list.slice(from, next).map(cardNode);

  if (reset) feedEl.replaceChildren(...frag);
  else {
    $('#feed .more')?.remove();
    feedEl.append(...frag);
  }
  state.shown = next;

  document.querySelector('#feed .more')?.remove();
  if (state.shown < list.length){
    const more = document.createElement('div');
    more.className = 'more';
    const b = document.createElement('button');
    b.type = 'button';
    b.textContent = `더 보기 (${list.length - state.shown}건)`;
    b.addEventListener('click', () => render(false));
    more.append(b);
    feedEl.append(more);
    io.observe(more);
  }
}

const io = new IntersectionObserver(es => {
  for (const e of es){
    if (e.isIntersecting && !state.loading && state.shown < state.list.length) render(false);
  }
}, {rootMargin:'700px'});

/* ── 상세 시트 ──────────────────────────────────────────────────── */
function openSheet(it){
  setBeat($('.sheet__beat', sheet), it.b);
  const when = $('.sheet__when', sheet);
  const paint = () => { when.textContent = [kst(it.ts, true), REGION[it.r], (it.src && it.src[0])].filter(Boolean).join(' · '); };
  when.removeEventListener('tick', paint);
  when.addEventListener('tick', paint);
  paint();

  const t = $('.sheet__title', sheet);
  t.textContent = titleOf(it);
  if (!it.h) t.lang = 'en'; else t.removeAttribute('lang');

  const orig = $('.sheet__orig', sheet);
  orig.textContent = it.h && it.t ? it.t : '';
  if (orig.textContent) orig.lang = 'en';
  $('.sheet__body', sheet).textContent = it.summary || '';

  $('.sheet__src', sheet).replaceChildren(...(it.src || []).map(s => {
    const li = document.createElement('li'); li.textContent = s; return li;
  }));

  const cta = $('.sheet__cta', sheet);
  if (it.url){ cta.href = it.url; cta.hidden = false; }
  else { cta.removeAttribute('href'); cta.hidden = true; }

  $('.sheet__inner', sheet).scrollTop = 0;
  sheet.showModal();
  requestAnimationFrame(() => sheet.classList.add('is-open'));
  document.documentElement.style.overflow = 'hidden';
}
function closeSheet(){
  sheet.classList.remove('is-open');
  document.documentElement.style.overflow = '';
  setTimeout(() => { if (!sheet.classList.contains('is-open')) sheet.close(); }, 280);
}
sheet.addEventListener('close', () => {
  sheet.classList.remove('is-open');
  document.documentElement.style.overflow = '';
});
sheet.addEventListener('click', e => { if (e.target === sheet) closeSheet(); });

let y0 = 0, dy = 0, drag = false;
sheet.addEventListener('touchstart', e => {
  if ($('.sheet__inner', sheet).scrollTop > 0) return;
  y0 = e.touches[0].clientY; dy = 0; drag = true; sheet.style.transition = 'none';
}, {passive:true});
sheet.addEventListener('touchmove', e => {
  if (!drag) return;
  dy = Math.max(0, e.touches[0].clientY - y0);
  sheet.style.transform = `translateY(${dy}px)`;
}, {passive:true});
sheet.addEventListener('touchend', () => {
  if (!drag) return;
  drag = false;
  sheet.style.transition = ''; sheet.style.transform = '';
  if (dy > 90) closeSheet();
});

/* ── 칩 ─────────────────────────────────────────────────────────── */
$('#filters').addEventListener('click', e => {
  const btn = e.target.closest('.chip');
  if (!btn) return;
  state.beat = btn.dataset.beat;
  document.querySelectorAll('.chip').forEach(b =>
    b.setAttribute('aria-pressed', String(b.dataset.beat === state.beat)));
  badge.hidden = true;
  render(true);
  window.scrollTo({ top:0, behavior:'smooth' });
});

/* 새 기사 배지는 "보이면 사라진다" — 맨 위로 오면 숨긴다 */
addEventListener('scroll', () => { if (window.scrollY < 80 && !badge.hidden) badge.hidden = true; }, {passive:true});
badge.addEventListener('click', () => {
  badge.hidden = true;
  render(true);
  window.scrollTo({ top:0, behavior:'smooth' });
});

/* ── 불러오기 ───────────────────────────────────────────────────── */
async function load(){
  let err;
  for (const u of FEED_SOURCES){
    try {
      const r = await fetch(u, {cache:'no-store'});
      if (!r.ok) throw new Error('HTTP ' + r.status);
      const d = await r.json();
      if (!Array.isArray(d.items)) throw new Error('bad payload');
      return d;
    } catch (e){ err = e; }
  }
  throw err || new Error('fetch failed');
}

let timer = null;
function schedule(ms){
  clearTimeout(timer);
  timer = setTimeout(() => { if (!document.hidden) poll(false); }, ms);
}

async function poll(first){
  try {
    const d = await load();
    const next = d.items;
    const fresh = first ? [] : next.filter(it => !state.seen.has(keyOf(it)));
    state.items = next;
    state.seen = new Set(next.map(keyOf));
    state.loading = false;

    const atTop = window.scrollY < 80;
    if (first || atTop || !fresh.length){
      render(true);
      badge.hidden = true;               // 새 글이 이미 화면에 있으면 배지는 띄우지 않는다
    } else {
      const visible = fresh.filter(it => state.beat === 'ALL' || it.b === state.beat);
      if (visible.length){ badgeN.textContent = visible.length; badge.hidden = false; }
    }
    buildTicker();
    tickTimes();
    const ageMin = d.generated_at ? (Date.now() - new Date(d.generated_at)) / 60000 : 0;
    schedule(ageMin > 8 ? POLL_FAST_MS : POLL_MS);
  } catch (e){
    state.loading = false;
    if (first){
      feedEl.innerHTML = '<p class="empty"><strong>피드를 불러오지 못했어요</strong>' +
        '연결을 확인한 뒤 다시 시도해 주세요.<button type="button" id="retry">지금 다시 시도</button></p>';
      feedEl.setAttribute('aria-busy','false');
      $('#retry').addEventListener('click', () => { skeletons(); poll(true); });
    }
    schedule(POLL_FAST_MS * 2);
  }
}

document.addEventListener('visibilitychange', () => {
  if (!document.hidden){ poll(false); tickTimes(); } else clearTimeout(timer);
});

/* ── 속보 티커: 시간 + 중요도 ────────────────────────────────────────
   후보 = 최근 36시간. 점수 = (중요도 정규화) × (신선도 가중) × (비트 가중).
   신선도는 10시간 반감, 분쟁은 1.15·경제는 1.05 가중. 상위 8건을 최신순으로 흘린다. */
const ticker = $('#ticker'), tickerTrack = $('#tickerTrack'),
      pinBtn = $('#pinBtn'), unpinBtn = $('#unpinBtn');
const PIN_KEY = 'wp-ticker-pin';
let tickerSig = '';

function breakingItems(){
  const now = Date.now();
  const cand = state.items.filter(it => it.ts && (now - new Date(it.ts)) < 36 * 3600e3);
  const scored = cand.map(it => {
    const ageH = (now - new Date(it.ts)) / 3600e3;
    const recency = Math.exp(-ageH / 10);
    const imp = (it.s || 12) / 20;
    const w = it.b === 'CONFLICT' ? 1.15 : it.b === 'ECONOMY' ? 1.05 : 1;
    return { it, k: imp * (0.45 + 0.55 * recency) * w };
  }).sort((a, b) => b.k - a.k);
  return scored.slice(0, 8).map(x => x.it).sort((a, b) => new Date(b.ts) - new Date(a.ts));
}

function buildTicker(){
  const items = breakingItems();
  const sig = items.map(i => i.ts + titleOf(i)).join('|');
  if (sig === tickerSig) return;
  tickerSig = sig;
  if (!items.length){ ticker.hidden = true; return; }
  ticker.hidden = false;
  const make = it => {
    const b = document.createElement('button');
    b.type = 'button';
    b.className = 'ticker__item';
    const t = document.createElement('b');
    t.textContent = kst(it.ts);
    b.append(t, document.createTextNode(titleOf(it)));
    b.addEventListener('click', () => openSheet(it));
    return b;
  };
  tickerTrack.replaceChildren(...items.map(make), ...items.map(make));   // 2벌 = 끊김 없는 루프
  tickerTrack.style.setProperty('--dur', Math.min(90, Math.max(30, items.length * 9)) + 's');
  tickerTrack.style.animation = 'none';
  void tickerTrack.offsetWidth;        // 애니메이션 재시작
  tickerTrack.style.animation = '';
}

function scrollToTop(ms = 420){
  if (matchMedia('(prefers-reduced-motion: reduce)').matches){ window.scrollTo(0, 0); return; }
  const from = window.scrollY;
  if (from <= 0) return;
  const t0 = performance.now();
  const dur = Math.min(ms, 200 + from * 0.35);
  const ease = t => 1 - Math.pow(1 - t, 3);
  (function step(now){
    const k = Math.min(1, (now - t0) / dur);
    window.scrollTo(0, Math.round(from * (1 - ease(k))));
    if (k < 1) requestAnimationFrame(step);
  })(t0);
}

function setPinned(on, smooth){
  document.body.classList.toggle('is-pinned', on);
  ticker.classList.toggle('is-pinned', on);
  pinBtn.hidden = on;
  unpinBtn.hidden = !on;
  pinBtn.setAttribute('aria-pressed', String(on));
  try { localStorage.setItem(PIN_KEY, on ? '1' : '0'); } catch {}
  if (on && smooth) scrollToTop();          // 위로 쭉 올라가 고정
}
pinBtn.addEventListener('click', () => setPinned(true, true));
unpinBtn.addEventListener('click', () => setPinned(false, false));

try { if (localStorage.getItem(PIN_KEY) === '1') setPinned(true, false); } catch {}

skeletons();
poll(true);
</script>
