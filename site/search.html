<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>검색 — WebPaper</title>
<meta name="theme-color" content="#ffffff" media="(prefers-color-scheme:light)">
<meta name="theme-color" content="#101114" media="(prefers-color-scheme:dark)">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='7' fill='%23191a1c'/><rect x='7' y='9' width='18' height='3' rx='1.5' fill='%23fff'/><rect x='7' y='15' width='18' height='2.4' rx='1.2' fill='%23ffffffaa'/><rect x='7' y='20' width='11' height='2.4' rx='1.2' fill='%23ffffffaa'/></svg>">
<script>(function(){try{var t=localStorage.getItem('wp-theme');if(t==='dark'||t==='light')document.documentElement.dataset.theme=t;}catch(e){}})();</script>
<style>
:root{
  --bg:#fff; --fg:#191919; --muted:#6b6b6b; --line:#ececec; --chip:#f2f4f6;
  --accent:#3182f6; --beatsel:#191919; --beatsel-fg:#fff;
  --t-tech:#3182f6; --t-economy:#0e9f6e; --t-conflict:#e02424; --t-politics:#4b5563; --t-other:#8b95a1;
  --font-base:16px; --font-summary:15px; --font-caption:13px;
  --lh:1.6; --radius:16px; --maxw:640px; --safe-b:env(safe-area-inset-bottom,0px);
  --pad:16px; --back-w:40px; --hdr-gap:10px;
}
:root[data-theme="dark"]{
  --bg:#101114; --fg:#f0f1f3; --muted:#9aa0a6; --line:#26282d; --chip:#1c1e23;
  --accent:#4f9bff; --beatsel:#f0f1f3; --beatsel-fg:#101114;
  --t-tech:#6aa9ff; --t-economy:#34d399; --t-conflict:#f87171; --t-politics:#9aa5b4; --t-other:#7d8794;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#101114; --fg:#f0f1f3; --muted:#9aa0a6; --line:#26282d; --chip:#1c1e23;
    --accent:#4f9bff; --beatsel:#f0f1f3; --beatsel-fg:#101114;
    --t-tech:#6aa9ff; --t-economy:#34d399; --t-conflict:#f87171; --t-politics:#9aa5b4; --t-other:#7d8794;
  }
}
*{box-sizing:border-box;margin:0;-webkit-tap-highlight-color:transparent}
html,body{background:var(--bg);color:var(--fg)}
body{font-family:system-ui,-apple-system,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  font-size:var(--font-base);line-height:var(--lh);letter-spacing:-.01em;word-break:keep-all;
  padding-bottom:calc(40px + var(--safe-b))}
a{color:inherit}
.app{max-width:var(--maxw);margin:0 auto}

.header{position:sticky;top:0;z-index:20;background:var(--bg);border-bottom:1px solid var(--line);
  padding:10px var(--pad);display:flex;align-items:center;gap:var(--hdr-gap)}
.back-btn{width:var(--back-w);height:40px;display:grid;place-items:center;border:0;border-radius:12px;
  background:transparent;color:var(--muted);cursor:pointer;flex:0 0 auto;text-decoration:none}
.back-btn:hover{background:var(--chip);color:var(--fg)}
.search-wrap{flex:1;position:relative}
.search-wrap svg.q{position:absolute;left:13px;top:50%;transform:translateY(-50%);color:var(--muted);pointer-events:none}
#q{width:100%;height:42px;padding:0 40px 0 38px;border:1px solid var(--line);border-radius:12px;
  background:var(--chip);font:inherit;font-size:15px;color:var(--fg);outline:none;transition:border-color .15s}
#q:focus{border-color:var(--accent);background:var(--bg)}
#q::placeholder{color:var(--muted)}
#q::-webkit-search-cancel-button{display:none}
.clear-btn{position:absolute;right:6px;top:50%;transform:translateY(-50%);width:30px;height:30px;
  display:none;place-items:center;border:0;background:transparent;color:var(--muted);cursor:pointer;border-radius:8px}
.clear-btn.show{display:grid}
.clear-btn:hover{background:var(--chip);color:var(--fg)}

.filter-bar{display:flex;gap:8px;overflow-x:auto;padding:10px var(--pad) 8px;scrollbar-width:none;
  max-width:var(--maxw);margin:0 auto}
.filter-bar::-webkit-scrollbar{display:none}
.chip{flex:0 0 auto;min-height:34px;padding:0 13px;border:0;border-radius:17px;background:var(--chip);
  color:var(--muted);font:inherit;font-size:13px;font-weight:600;cursor:pointer;transition:background .12s,color .12s}
.chip[aria-pressed="true"]{background:var(--beatsel);color:var(--beatsel-fg)}
.chip[data-region][aria-pressed="true"]{background:transparent;color:var(--accent);
  box-shadow:inset 0 0 0 1.5px var(--accent)}
.fsep{flex:0 0 auto;width:1px;height:18px;align-self:center;background:var(--line);margin:0 2px}

/* 결과 정보 + 정렬 세그먼트 (네이티브 select 대신) */
.result-info{display:flex;align-items:center;gap:8px;
  padding:6px var(--pad) 8px calc(var(--pad) + var(--back-w) + var(--hdr-gap));
  font-size:var(--font-caption);color:var(--muted);max-width:var(--maxw);margin:0 auto}
.result-info[hidden]{display:none}
.result-info b{color:var(--fg);font-weight:700}
.seg{margin-left:auto;display:flex;background:var(--chip);border-radius:10px;padding:2px}
.seg button{border:0;background:transparent;color:var(--muted);font:inherit;font-size:12.5px;font-weight:600;
  padding:5px 10px;border-radius:8px;cursor:pointer;transition:background .12s,color .12s}
.seg button[aria-pressed="true"]{background:var(--bg);color:var(--fg);box-shadow:0 1px 3px rgba(0,0,0,.10)}

main{padding:0 var(--pad)}
/* 최근 검색어: 검색 입력창과 왼쪽을 맞춘다 */
.recent-section{padding:20px var(--pad) 0 calc(var(--pad) + var(--back-w) + var(--hdr-gap))}
.section-label{font-size:12px;font-weight:700;color:var(--muted);margin:0 0 10px;letter-spacing:.02em}
.recent-list{display:flex;flex-wrap:wrap;gap:8px}
.recent-chip{display:inline-flex;align-items:center;gap:6px;min-height:34px;padding:0 12px;border:1px solid var(--line);
  border-radius:17px;background:var(--bg);color:var(--fg);font:inherit;font-size:13.5px;cursor:pointer}
.recent-chip .x{color:var(--muted);font-size:11px}
.recent-empty{color:var(--muted);font-size:13px}

.card{display:block;padding:16px;border:1px solid var(--line);border-radius:var(--radius);
  margin-bottom:10px;text-decoration:none;color:inherit;cursor:pointer;
  content-visibility:auto;contain-intrinsic-size:auto 130px}
.card:hover{border-color:color-mix(in srgb,var(--fg) 16%,var(--line))}
.card:active{background:var(--chip)}
.card-top{display:flex;align-items:center;gap:7px;margin-bottom:8px;min-width:0}
.beat{font-size:11px;font-weight:700;letter-spacing:.02em;padding:2px 8px;border-radius:6px;
  color:var(--c,var(--muted));background:color-mix(in srgb,var(--c,var(--muted)) 12%,transparent);flex:0 0 auto}
.beat[data-beat="TECH"]{--c:var(--t-tech)}
.beat[data-beat="ECONOMY"]{--c:var(--t-economy)}
.beat[data-beat="CONFLICT"]{--c:var(--t-conflict)}
.beat[data-beat="POLITICS"]{--c:var(--t-politics)}
.beat[data-beat="OTHER"]{--c:var(--t-other)}
.where{font-size:var(--font-caption);color:var(--muted);overflow:hidden;text-overflow:ellipsis;
  white-space:nowrap;flex:1 1 auto;min-width:0}
.card-top time{font-size:var(--font-caption);color:var(--muted);white-space:nowrap;flex:0 0 auto;
  font-variant-numeric:tabular-nums}
.card-title{font-size:16px;font-weight:700;line-height:1.45;margin:0 0 6px;letter-spacing:-.01em;
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.card-title[lang="en"]{font-size:15px}
.card-body{font-size:14px;line-height:1.6;color:var(--muted);
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
mark{padding:0 1px;border-radius:2px;background:color-mix(in srgb,var(--accent) 22%,transparent);
  color:inherit;font-weight:600}

.empty-state{text-align:center;padding:56px 20px;color:var(--muted);font-size:14px}
.empty-title{font-size:16px;font-weight:700;color:var(--fg);margin-bottom:6px}
.more{display:grid;place-items:center;padding:6px 0 18px}
.more button{min-height:44px;padding:0 22px;border:1px solid var(--line);border-radius:22px;
  background:var(--bg);color:var(--muted);font:inherit;font-size:var(--font-caption);cursor:pointer}

/* 기사 상세 시트 (메인과 동일) */
.sheet{position:fixed;inset:auto 0 0 0;margin:0 auto;width:100%;max-width:var(--maxw);border:0;padding:0;
  border-radius:20px 20px 0 0;background:var(--bg);color:var(--fg);max-height:86dvh;
  box-shadow:0 -6px 24px rgba(0,0,0,.16);transform:translateY(100%);
  transition:transform .26s cubic-bezier(.2,.8,.2,1)}
.sheet.is-open{transform:translateY(0)}
.sheet::backdrop{background:rgba(0,0,0,.4)}
.sheet__inner{padding:8px 20px calc(24px + env(safe-area-inset-bottom));max-height:86dvh;
  overflow-y:auto;overscroll-behavior:contain}
.sheet__grip{width:36px;height:4px;border-radius:2px;background:var(--line);margin:0 auto 14px}
.sheet__meta{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:10px}
.sheet__when{font-size:var(--font-caption);color:var(--muted)}
.sheet__title{font-size:20px;font-weight:750;line-height:1.4;margin-bottom:4px;letter-spacing:-.01em}
.sheet__orig{font-size:var(--font-caption);color:var(--muted);margin-bottom:14px;padding-bottom:14px;
  border-bottom:1px solid var(--line)}
.sheet__orig:empty{display:none}
.sheet__body{font-size:var(--font-summary);line-height:1.7;white-space:pre-wrap}
.sheet__src{margin-top:16px;padding-top:14px;border-top:1px solid var(--line);display:grid;gap:4px}
.sheet__src:empty{display:none}
.sheet__src li{font-size:var(--font-caption);color:var(--muted)}
.sheet__src li::before{content:"· ";font-weight:700}
.sheet__cta{display:flex;align-items:center;justify-content:center;margin-top:18px;min-height:44px;
  border-radius:12px;background:var(--accent);color:#fff;text-decoration:none;font-weight:700;
  font-size:var(--font-summary)}
.sheet__cta[hidden]{display:none}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div class="app">
  <header class="header">
    <a class="back-btn" href="./" aria-label="뒤로">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"
           stroke-linecap="round" aria-hidden="true"><path d="M15 6l-6 6 6 6"/></svg>
    </a>
    <form class="search-wrap" id="searchForm" role="search" onsubmit="return false">
      <svg class="q" width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor"
           stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
      <input id="q" type="search" placeholder="제목·요약 검색" autocomplete="off" autocorrect="off"
             autocapitalize="off" spellcheck="false" enterkeyhint="search" aria-label="검색" autofocus>
      <button class="clear-btn" id="clear" type="button" aria-label="지우기">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"
             stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg>
      </button>
    </form>
  </header>

  <div class="filter-bar" id="filterBar" aria-label="분야와 지역"></div>

  <div class="result-info" id="resultInfo" hidden>
    <span><b id="resultCount">0</b>건</span>
    <div class="seg" role="group" aria-label="정렬">
      <button type="button" data-sort="latest" aria-pressed="true">최신순</button>
      <button type="button" data-sort="relevance" aria-pressed="false">관련도순</button>
    </div>
  </div>

  <div class="recent-section" id="recentSection">
    <div class="section-label">최근 검색어</div>
    <div class="recent-list" id="recentList"></div>
  </div>

  <main id="results"></main>
</div>

<dialog id="sheet" class="sheet" aria-label="기사 자세히">
  <div class="sheet__inner">
    <div class="sheet__grip" aria-hidden="true"></div>
    <div class="sheet__meta">
      <span class="sheet__beat beat"></span>
      <span class="sheet__when"></span>
    </div>
    <h2 class="sheet__title"></h2>
    <p class="sheet__orig"></p>
    <p class="sheet__body"></p>
    <ul class="sheet__src"></ul>
    <a class="sheet__cta" target="_blank" rel="noopener noreferrer">기사 읽기 →</a>
  </div>
</dialog>

<script>
/* 같은 출처 우선, 실패하면 저장소 raw */
const SOURCES = ['./feed.json',
  'https://raw.githubusercontent.com/yousungcake-wq/webpaper-osint/main/site/feed.json'];
const PAGE = 40;

const BEAT = { TECH:'테크', ECONOMY:'경제', CONFLICT:'분쟁', POLITICS:'정치', OTHER:'기타' };
const REGION = { US:'북미', LATAM:'중남미', EUROPE:'유럽', ASIA:'아시아', MIDDLE_EAST:'중동', AFRICA:'아프리카', GLOBAL:'국제' };
const BEATS = ['ALL', 'TECH', 'ECONOMY', 'CONFLICT', 'POLITICS', 'OTHER'];
const REGIONS = ['US', 'LATAM', 'EUROPE', 'ASIA', 'MIDDLE_EAST', 'AFRICA', 'GLOBAL'];
const $ = (s, r=document) => r.querySelector(s);

const state = {
  items: [], q: '', beat: 'ALL', regions: new Set(), sort: 'latest',
  list: [], shown: 0, loading: true
};

/* ── 시간 ─────────────────────────────────────────────────────── */
function kst(ts){
  if (!ts) return '';
  const d = new Date(ts);
  if (isNaN(d)) return '';
  const f = new Intl.DateTimeFormat('ko-KR', {
    timeZone:'Asia/Seoul', month:'numeric', day:'numeric', hour:'2-digit', minute:'2-digit', hour12:false
  }).formatToParts(d).reduce((o,p)=>(o[p.type]=p.value,o),{});
  return `${f.month}월 ${f.day}일 ${f.hour}:${f.minute}`;
}
function relTime(ts){
  const d = new Date(ts);
  if (isNaN(d)) return '';
  const m = Math.floor((Date.now() - d.getTime()) / 60000);
  if (m < 1) return '방금';
  if (m < 60) return m + '분 전';
  if (m < 24*60) return Math.floor(m/60) + '시간 전';
  return kst(ts);
}
const titleOf = it => it.h || it.t || '';
function tickTimes(){
  document.querySelectorAll('time[data-ts]').forEach(el => {
    const v = relTime(el.dataset.ts);
    if (el.textContent !== v) el.textContent = v;
  });
}
setInterval(tickTimes, 30_000);

/* ── 한국어 친화 검색 ────────────────────────────────────────────────
   토스의 es-hangul 이 하는 일(조사 제거·초성 검색)을 필요한 만큼만 직접 구현했다.
   ① 공백으로 토큰을 나누고 **모든 토큰이** 들어간 기사만 남긴다('이란 트럼프' → 둘 다)
   ② 조사를 떼고 비교한다('이란은' → '이란')
   ③ 초성만 쳐도 찾는다('ㅇㄹ' → '이란')
   ④ 영문은 소문자로 비교한다. */
const JOSA = ['으로서','으로써','에서는','에게서','이라고','라는','이라는','에서','에게','까지','부터',
              '보다','처럼','이랑','한테','으로','로','을','를','이','가','은','는','의','에','와','과','도','만','랑','께'];
const CHOSEONG = 'ㄱㄲㄴㄷㄸㄹㅁㅂㅃㅅㅆㅇㅈㅉㅊㅋㅌㅍㅎ';

function stripJosa(tok){
  if (tok.length <= 2) return tok;
  for (const j of JOSA){
    if (tok.length - j.length >= 2 && tok.endsWith(j)) return tok.slice(0, -j.length);
  }
  return tok;
}
function chosung(str){
  let out = '';
  for (const ch of str){
    const c = ch.codePointAt(0);
    if (c >= 0xAC00 && c <= 0xD7A3) out += CHOSEONG[Math.floor((c - 0xAC00) / 588)];
    else out += ch.toLowerCase();
  }
  return out;
}
const isJamo = s => /^[ㄱ-ㅎ]+$/.test(s);

function parseQuery(q){
  return (q || '').trim().split(/\s+/).filter(Boolean)
    .map(t => stripJosa(t.toLowerCase()))
    .filter(Boolean)
    .filter((t, i, a) => a.indexOf(t) === i);      // 중복 토큰 제거
}

/* 토큰 하나가 문자열에 있는지 (초성 질의 포함) */
function hasToken(hay, hayCho, tok){
  if (isJamo(tok)) return hayCho.includes(tok);
  if (hay.includes(tok)) return true;
  return false;                                    // 한글 부분 일치는 아래 countToken 에서 처리
}
function countToken(hay, tok){
  if (!tok) return 0;
  let n = 0, i = hay.indexOf(tok);
  while (i !== -1){ n++; i = hay.indexOf(tok, i + tok.length); }
  return n;
}

function matches(it, tokens){
  if (!tokens.length) return true;
  const text = (titleOf(it) + ' ' + (it.summary || '') + ' ' + (it.t || '')).toLowerCase();
  const cho = chosung(text);
  return tokens.every(t => hasToken(text, cho, t));
}

function relevance(it, tokens){
  if (!tokens.length) return 0;
  const title = titleOf(it).toLowerCase(), orig = (it.t || '').toLowerCase();
  const sum = (it.summary || '').toLowerCase();
  let score = 0;
  for (const t of tokens){
    if (isJamo(t)){                       // 초성 질의: 제목에 있으면 가점만
      if (chosung(title).includes(t)) score += 6;
      else if (chosung(sum).includes(t)) score += 2;
      continue;
    }
    const inTitle = countToken(title, t) + countToken(orig, t);
    const inSum = countToken(sum, t);
    if (inTitle) score += 10 + inTitle * 2;
    if (inSum) score += 4 + inSum;
  }
  return score;
}

/* ── 하이라이트 (textNode 만 조작) ─────────────────────────────── */
function highlightInto(el, text, tokens){
  el.textContent = '';
  const src = text || '';
  if (!tokens || !tokens.length){ el.textContent = src; return; }
  const lower = src.toLowerCase();
  const ranges = [];
  for (const t of tokens){
    if (isJamo(t)) continue;                       // 초성 질의는 위치를 되짚을 수 없다
    let i = lower.indexOf(t);
    while (i !== -1){ ranges.push([i, i + t.length]); i = lower.indexOf(t, i + t.length); }
  }
  if (!ranges.length){ el.textContent = src; return; }
  ranges.sort((a,b) => a[0] - b[0]);
  const merged = [];
  for (const r of ranges){
    const last = merged[merged.length - 1];
    if (last && r[0] <= last[1]) last[1] = Math.max(last[1], r[1]);
    else merged.push(r.slice());
  }
  const frag = document.createDocumentFragment();
  let pos = 0;
  for (const [a, b] of merged){
    if (a > pos) frag.appendChild(document.createTextNode(src.slice(pos, a)));
    const m = document.createElement('mark');
    m.textContent = src.slice(a, b);
    frag.appendChild(m);
    pos = b;
  }
  if (pos < src.length) frag.appendChild(document.createTextNode(src.slice(pos)));
  el.replaceChildren(frag);
}

/* ── 칩 ───────────────────────────────────────────────────────── */
function buildFilterBar(){
  const bar = $('#filterBar');
  BEATS.forEach(b => {
    const btn = document.createElement('button');
    btn.className = 'chip'; btn.type = 'button'; btn.dataset.beat = b;
    btn.textContent = b === 'ALL' ? '전체' : BEAT[b];
    btn.setAttribute('aria-pressed', String(state.beat === b));
    bar.append(btn);
  });
  const sep = document.createElement('span'); sep.className = 'fsep'; bar.append(sep);
  REGIONS.forEach(r => {
    const btn = document.createElement('button');
    btn.className = 'chip'; btn.type = 'button'; btn.dataset.region = r;
    btn.textContent = REGION[r];
    btn.setAttribute('aria-pressed', 'false');
    bar.append(btn);
  });
  bar.addEventListener('click', e => {
    const btn = e.target.closest('.chip');
    if (!btn) return;
    if (btn.dataset.region){
      const r = btn.dataset.region;
      if (state.regions.has(r)) state.regions.delete(r); else state.regions.add(r);
      btn.setAttribute('aria-pressed', String(state.regions.has(r)));
    } else {
      state.beat = btn.dataset.beat;
      bar.querySelectorAll('[data-beat]').forEach(b =>
        b.setAttribute('aria-pressed', String(b.dataset.beat === state.beat)));
    }
    syncHash(); renderResults(true);
  });
}

/* ── 결과 ─────────────────────────────────────────────────────── */
function getFiltered(){
  const tokens = parseQuery(state.q);
  let list = state.items.filter(it => {
    if (state.beat !== 'ALL' && it.b !== state.beat) return false;
    if (state.regions.size && !state.regions.has(it.r)) return false;
    return matches(it, tokens);
  });
  if (state.sort === 'relevance' && tokens.length){
    list = list.slice().sort((a,b) =>
      (relevance(b, tokens) - relevance(a, tokens)) || (new Date(b.ts) - new Date(a.ts)));
  }
  return list;
}

const hasFilter = () => !!state.q || state.beat !== 'ALL' || state.regions.size > 0;

function buildCard(it){
  const el = document.createElement('article');
  el.className = 'card';
  el.tabIndex = 0;
  el.setAttribute('role', 'button');

  const top = document.createElement('div');
  top.className = 'card-top';
  const pill = document.createElement('span');
  pill.className = 'beat';
  if (BEAT[it.b]){ pill.textContent = BEAT[it.b]; pill.dataset.beat = it.b; }
  const where = document.createElement('span');
  where.className = 'where';
  where.textContent = [REGION[it.r], (it.src && it.src[0]) || ''].filter(Boolean).join(' · ');
  const tm = document.createElement('time');
  tm.dataset.ts = it.ts || '';
  tm.dateTime = it.ts || '';
  tm.textContent = relTime(it.ts);
  top.append(pill, where, tm);

  const title = document.createElement('h2');
  title.className = 'card-title';
  highlightInto(title, titleOf(it), parseQuery(state.q));
  if (!it.h) title.lang = 'en';

  const body = document.createElement('p');
  body.className = 'card-body';
  highlightInto(body, it.summary || '', parseQuery(state.q));

  el.append(top, title, body);
  el.addEventListener('click', () => openSheet(it));   // 상세는 아래에서 올라온다
  el.addEventListener('keydown', e => {
    if (e.key === 'Enter' || e.key === ' '){ e.preventDefault(); openSheet(it); }
  });
  return el;
}

function renderResults(reset){
  const el = $('#results');
  if (state.loading) return;
  if (!hasFilter()){
    el.innerHTML = '';
    $('#resultInfo').hidden = true;
    $('#recentSection').style.display = '';
    return;
  }
  $('#recentSection').style.display = 'none';
  $('#resultInfo').hidden = false;

  state.list = getFiltered();
  $('#resultCount').textContent = String(state.list.length);

  if (!state.list.length){
    el.innerHTML = '<div class="empty-state"><div class="empty-title">검색 결과가 없어요</div>' +
      '다른 단어로 찾거나 필터를 조정해 보세요</div>';
    state.shown = 0;
    return;
  }

  if (reset) state.shown = 0;
  const from = reset ? 0 : state.shown;
  const next = Math.min(state.list.length, from + PAGE);
  const frag = state.list.slice(from, next).map(buildCard);

  if (reset) el.replaceChildren(...frag);
  else { $('.more')?.remove(); el.append(...frag); }
  state.shown = next;

  $('.more')?.remove();
  if (state.shown < state.list.length){
    const more = document.createElement('div');
    more.className = 'more';
    const b = document.createElement('button');
    b.type = 'button';
    b.textContent = `더 보기 (${state.list.length - state.shown}건)`;
    b.addEventListener('click', () => renderResults(false));
    more.append(b);
    el.append(more);
    io.observe(more);
  }
  tickTimes();
}

const io = new IntersectionObserver(es => {
  for (const e of es){
    if (e.isIntersecting && !state.loading && state.shown < state.list.length) renderResults(false);
  }
}, {rootMargin:'700px'});

/* ── 상세 시트 ─────────────────────────────────────────────────── */
const sheet = $('#sheet');
function openSheet(it){
  const beatEl = $('.sheet__beat', sheet);
  if (BEAT[it.b]){ beatEl.textContent = BEAT[it.b]; beatEl.dataset.beat = it.b; }
  else { beatEl.textContent = ''; delete beatEl.dataset.beat; }
  $('.sheet__when', sheet).textContent =
    [kst(it.ts), REGION[it.r], (it.src && it.src[0])].filter(Boolean).join(' · ');

  const t = $('.sheet__title', sheet);
  t.textContent = titleOf(it);
  if (!it.h) t.lang = 'en'; else t.removeAttribute('lang');
  const orig = $('.sheet__orig', sheet);
  orig.textContent = it.h && it.t ? it.t : '';
  if (orig.textContent) orig.lang = 'en';
  $('.sheet__body', sheet).textContent = it.summary || '';
  $('.sheet__src', sheet).replaceChildren(...(it.src || []).map(s => {
    const li = document.createElement('li'); li.textContent = s; return li;
  }));

  const cta = $('.sheet__cta', sheet);
  if (it.url){ cta.href = it.url; cta.hidden = false; }
  else { cta.removeAttribute('href'); cta.hidden = true; }

  $('.sheet__inner', sheet).scrollTop = 0;
  sheet.showModal();
  requestAnimationFrame(() => sheet.classList.add('is-open'));
  document.documentElement.style.overflow = 'hidden';
}
function closeSheet(){
  sheet.classList.remove('is-open');
  document.documentElement.style.overflow = '';
  setTimeout(() => { if (!sheet.classList.contains('is-open')) sheet.close(); }, 280);
}
sheet.addEventListener('close', () => {
  sheet.classList.remove('is-open');
  document.documentElement.style.overflow = '';
});
sheet.addEventListener('click', e => { if (e.target === sheet) closeSheet(); });

let y0 = 0, dy = 0, drag = false;
sheet.addEventListener('touchstart', e => {
  if ($('.sheet__inner', sheet).scrollTop > 0) return;
  y0 = e.touches[0].clientY; dy = 0; drag = true; sheet.style.transition = 'none';
}, {passive:true});
sheet.addEventListener('touchmove', e => {
  if (!drag) return;
  dy = Math.max(0, e.touches[0].clientY - y0);
  sheet.style.transform = `translateY(${dy}px)`;
}, {passive:true});
sheet.addEventListener('touchend', () => {
  if (!drag) return;
  drag = false;
  sheet.style.transition = ''; sheet.style.transform = '';
  if (dy > 90) closeSheet();
});

/* ── 최근 검색어 ───────────────────────────────────────────────── */
const LS = 'webpaper-recent';
const getRecent = () => { try { return JSON.parse(localStorage.getItem(LS) || '[]'); } catch { return []; } };
const setRecent = v => { try { localStorage.setItem(LS, JSON.stringify(v.slice(0, 8))); } catch {} };
function addRecent(kw){
  kw = (kw || '').trim();
  if (!kw) return;
  setRecent([kw, ...getRecent().filter(x => x !== kw)]);
  renderRecent();
}
function renderRecent(){
  const list = getRecent();
  const wrap = $('#recentList');
  if (!list.length){
    wrap.innerHTML = '<span class="recent-empty">최근 검색어가 없어요</span>';
    return;
  }
  wrap.replaceChildren(...list.map(kw => {
    const b = document.createElement('button');
    b.type = 'button'; b.className = 'recent-chip';
    const label = document.createElement('em');
    label.style.fontStyle = 'normal'; label.textContent = kw;
    const x = document.createElement('span'); x.className = 'x'; x.textContent = '✕';
    x.setAttribute('aria-hidden', 'true');
    b.append(label, x);
    x.addEventListener('click', ev => {
      ev.stopPropagation();
      setRecent(getRecent().filter(v => v !== kw));
      renderRecent();
    });
    b.addEventListener('click', () => applyQuery(kw, true));
    return b;
  }));
}

/* ── 입력 ─────────────────────────────────────────────────────── */
const qEl = $('#q'), clearBtn = $('#clear');
let debounce = null;
let composing = false;       // 한글 조합 중 Enter 를 무시한다

function applyQuery(val, commit){
  state.q = (val || '').trim();
  qEl.value = state.q;                        // IME 가 덧붙인 잔여 텍스트를 정리
  clearBtn.classList.toggle('show', !!state.q);
  if (commit && state.q) addRecent(state.q);
  syncHash();
  renderResults(true);
}

qEl.addEventListener('compositionstart', () => { composing = true; });
qEl.addEventListener('compositionend', () => {
  composing = false;
  clearTimeout(debounce);
  debounce = setTimeout(() => applyQuery(qEl.value, false), 180);
});
qEl.addEventListener('input', e => {
  if (e.isComposing || composing) return;
  clearTimeout(debounce);
  const v = e.target.value;
  clearBtn.classList.toggle('show', !!v);
  debounce = setTimeout(() => applyQuery(v, false), 180);
});
/* 모바일 키보드 '검색' 키: form submit 과 keydown 이 겹쳐도 한 번만 처리한다.
   state.q(직전 입력)가 새 값의 접두사면 그걸 쓴다 — IME 가 마지막 어절을 한 번 더
   붙이는 경우('이란 트럼프트럼프')를 여기서 잘라낸다. */
function commitFromInput(){
  if (composing) return;
  clearTimeout(debounce);
  const raw = qEl.value.trim();
  const lastTok = state.q.split(/\s+/).pop() || '';
  // IME 가 마지막 어절을 한 번 더 붙인 경우만 잘라낸다
  // ('이란 트럼프' + '트럼프' = '이란 트럼프트럼프'). 정상 확장('이란'→'이란 트럼프')은 그대로 둔다.
  const v = (state.q && lastTok && raw === state.q + lastTok) ? state.q : raw;
  applyQuery(v, true);
  qEl.blur();
}
$('#searchForm').addEventListener('submit', e => { e.preventDefault(); commitFromInput(); });
qEl.addEventListener('keydown', e => {
  if (e.key === 'Enter'){ e.preventDefault(); commitFromInput(); }
  if (e.key === 'Escape'){ e.preventDefault(); applyQuery('', false); qEl.blur(); }
});
clearBtn.addEventListener('click', () => { applyQuery('', false); qEl.focus(); });

/* ── 정렬 세그먼트 (네이티브 select 대신) ─────────────────────────── */
$('.seg').addEventListener('click', e => {
  const btn = e.target.closest('button[data-sort]');
  if (!btn) return;
  state.sort = btn.dataset.sort;
  document.querySelectorAll('.seg button').forEach(b =>
    b.setAttribute('aria-pressed', String(b.dataset.sort === state.sort)));
  syncHash();
  renderResults(true);
});

/* ── 해시 ─────────────────────────────────────────────────────── */
function syncHash(){
  const p = [];
  if (state.q) p.push('q=' + encodeURIComponent(state.q));
  if (state.beat !== 'ALL') p.push('b=' + state.beat);
  if (state.regions.size) p.push('r=' + [...state.regions].join(','));
  if (state.sort !== 'latest') p.push('s=' + state.sort);
  history.replaceState(null, '', p.length ? '#' + p.join('&') : location.pathname);
}
function loadHash(){
  const h = location.hash.slice(1);
  if (!h) return;
  h.split('&').forEach(part => {
    const i = part.indexOf('='); if (i < 0) return;
    const k = part.slice(0, i), v = decodeURIComponent(part.slice(i + 1));
    if (k === 'q') state.q = v;
    if (k === 'b' && (v === 'ALL' || BEAT[v])) state.beat = v;
    if (k === 'r') v.split(',').forEach(x => REGION[x] && state.regions.add(x));
    if (k === 's' && (v === 'latest' || v === 'relevance')) state.sort = v;
  });
  qEl.value = state.q;
  clearBtn.classList.toggle('show', !!state.q);
  document.querySelectorAll('[data-beat]').forEach(b =>
    b.setAttribute('aria-pressed', String(b.dataset.beat === state.beat)));
  document.querySelectorAll('[data-region]').forEach(b =>
    b.setAttribute('aria-pressed', String(state.regions.has(b.dataset.region))));
  document.querySelectorAll('.seg button').forEach(b =>
    b.setAttribute('aria-pressed', String(b.dataset.sort === state.sort)));
}

/* ── 로드 ─────────────────────────────────────────────────────── */
async function loadFeed(){
  let err;
  for (const u of SOURCES){
    try {
      const r = await fetch(u, {cache:'no-store'});
      if (!r.ok) throw new Error('HTTP ' + r.status);
      const d = await r.json();
      if (!Array.isArray(d.items)) throw new Error('bad payload');
      return d;
    } catch (e){ err = e; }
  }
  throw err || new Error('fetch failed');
}

async function init(){
  buildFilterBar();
  renderRecent();
  loadHash();
  try {
    const d = await loadFeed();
    state.items = d.items;
    state.loading = false;
    renderResults(true);
  } catch (e){
    state.loading = false;
    $('#results').innerHTML = '<div class="empty-state"><div class="empty-title">피드를 불러오지 못했어요</div>' +
      '잠시 뒤 다시 시도해 주세요</div>';
  }
}
init();
</script>
